[package]
name = "pybridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["deep-showdown"]

# Excluded from the core workspace (see ../../Cargo.toml) so `cargo build`/`cargo test` for the
# engine never need a Python toolchain. Built on its own via maturin.

[lib]
name = "showdown_engine"
# cdylib: the Python extension module. rlib: lets `cargo test -p pybridge` link normally.
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
# The PS<->engine state bridge (convert/export). Used by `export_state` to turn any live sim
# state into a PS deserializeBattle-loadable snapshot for spot-checking.
cosim = { path = "../cosim" }
# `extension-module` is intentionally NOT enabled unconditionally: that feature tells pyo3 not to
# link libpython, which makes a plain `cargo test` bin fail to link (no interpreter to supply the
# symbols). maturin sets `PYO3_BUILD_EXTENSION_MODULE=1` for the real wheel build, so the shipped
# `.so` still gets extension-module linkage; `cargo test -p pybridge` links libpython normally.
pyo3 = { version = "0.22" }
serde_json = "1"
numpy = "0.22"
rayon = "1.10"
flate2 = "1"
# Turn resolution is allocation-heavy (a Vec<Instruction> and a cloned State per branch), and
# glibc malloc measurably throttles it: swapping to mimalloc is +25% single-thread and +37% at
# 8 threads on real random-battle teams, with no semantic change. Default-on; disable with
# --no-default-features if you need to A/B it.
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
default = ["mimalloc-alloc"]
mimalloc-alloc = ["dep:mimalloc"]
# Opt-in extension-module linkage for anyone building the cdylib directly with cargo.
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
