[package]
name = "pybridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["deep-showdown"]

# Excluded from the core workspace (see ../../Cargo.toml) so `cargo build`/`cargo test` for the
# engine never need a Python toolchain. Built on its own via maturin.

[lib]
name = "showdown_engine"
# cdylib: the Python extension module. rlib: lets `cargo test -p pybridge` link normally.
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
# `extension-module` is intentionally NOT enabled unconditionally: that feature tells pyo3 not to
# link libpython, which makes a plain `cargo test` bin fail to link (no interpreter to supply the
# symbols). maturin sets `PYO3_BUILD_EXTENSION_MODULE=1` for the real wheel build, so the shipped
# `.so` still gets extension-module linkage; `cargo test -p pybridge` links libpython normally.
pyo3 = { version = "0.22" }
serde_json = "1"
numpy = "0.22"
rayon = "1.10"
flate2 = "1"

[features]
# Opt-in extension-module linkage for anyone building the cdylib directly with cargo.
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
