[project]
name = "deep-showdown-agents"
version = "0.1.0"
description = "PPO agents for the deep-showdown battle engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "wandb>=0.16",
]

[dependency-groups]
# Build tool for the Rust<->Python bridge (crates/pybridge).
dev = [
    "maturin>=1.5,<2.0",
]
# Real poke-env players as external eval opponents (PokeEnvBaseline). Install with
# `uv sync --group pokeenv`. Opt-in so the core training deps stay lean.
pokeenv = [
    "poke-env>=0.15",
]

[tool.setuptools]
packages = ["ppo"]
